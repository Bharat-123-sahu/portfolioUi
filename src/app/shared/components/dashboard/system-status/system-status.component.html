<article class="system-status">
  <header>
    <h3>System Status</h3>
  </header>

  <div
    class="status-row"
    *ngFor="let item of items">
    <span>{{ item.title }}</span>
    <ion-badge [color]="getColor(item.status)">{{ item.status }}</ion-badge>
  </div>

  <div
    class="empty"
    *ngIf="!items.length">
    No status data available.
  </div>
</article>
