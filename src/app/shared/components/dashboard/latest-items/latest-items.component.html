<article class="dashboard-card">
  <header>
    <h3>{{ title }}</h3>
  </header>

  <div
    class="item"
    *ngFor="let item of items">
    <strong>{{ item.title }}</strong>
    <span>{{ item.subtitle }}</span>
  </div>

  <div
    class="empty"
    *ngIf="!items.length">
    No recent items.
  </div>
</article>
