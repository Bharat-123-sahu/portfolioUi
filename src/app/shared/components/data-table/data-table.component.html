<div class="table-container">

  <table class="data-table">

    <thead>

      <tr>

        <th *ngFor="let column of columns; trackBy: trackByIndex">

          {{ column.label }}

        </th>

        <th *ngIf="showActions" class="action-column">

          Actions

        </th>

      </tr>

    </thead>

    <tbody>

      <ng-container *ngIf="loading">
        <tr *ngFor="let row of skeletonRows()">
          <td *ngFor="let column of columns">
            <ion-skeleton-text animated class="table-skeleton"></ion-skeleton-text>
          </td>

          <td *ngIf="showActions" class="action-buttons">
            <ion-skeleton-text animated class="action-skeleton"></ion-skeleton-text>
          </td>
        </tr>
      </ng-container>

      <tr *ngFor="let row of loading ? [] : data">

        <td
          *ngFor="let column of columns"
          [attr.data-label]="column.label">

          <ng-container [ngSwitch]="column.type">

            <!-- Image -->

            <img
              *ngSwitchCase="'image'"
              class="table-image"
              [src]="getImageUrl(getValue(row, column.key))"
              [alt]="column.label">

            <!-- Status Badge -->

            <ion-badge
              *ngSwitchCase="'badge'"
              [color]="getBadgeColor(getValue(row, column.key))">

              {{ getBadgeText(getValue(row, column.key)) }}

            </ion-badge>

            <!-- Date -->

            <span *ngSwitchCase="'date'">

              {{ getValue(row, column.key) | date:'dd MMM yyyy' }}

            </span>

            <!-- Default -->

            <span *ngSwitchDefault>

              {{ getValue(row, column.key) }}

            </span>

          </ng-container>

        </td>

        <td
          *ngIf="showActions"
          class="action-buttons"
          data-label="Actions">

          <ion-button
            fill="clear"
            color="primary"
            size="small"
            (click)="onEdit(row)">

            Edit

          </ion-button>

          <ion-button
            fill="clear"
            color="danger"
            size="small"
            (click)="onDelete(row)">

            Delete

          </ion-button>

        </td>

      </tr>

      <!-- Empty State -->

      <tr *ngIf="!loading && !data.length">

        <td
          [attr.colspan]="columns.length + (showActions ? 1 : 0)"
          class="empty-row">

          <ion-icon name="folder-open-outline"></ion-icon>
          <strong>{{ emptyTitle }}</strong>
          <span>{{ emptyMessage }}</span>

        </td>

      </tr>

    </tbody>

  </table>

</div>
