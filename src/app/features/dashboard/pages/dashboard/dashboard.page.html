<ion-content>

    <div class="dashboard-container">

        <app-welcome-banner
            [userName]="'Bharat'">
        </app-welcome-banner>

        <app-loading
            *ngIf="loading"
            message="Loading dashboard..."
            [rows]="6">
        </app-loading>

        <app-empty-state
            *ngIf="!loading && errorMessage"
            icon="alert-circle-outline"
            color="danger"
            title="Dashboard unavailable"
            [message]="errorMessage"
            actionText="Retry"
            (action)="loadDashboard()">
        </app-empty-state>

        <ng-container *ngIf="!loading && !errorMessage">

            <app-metric-grid
                [stats]="stats">
            </app-metric-grid>

            <div class="grid">

                <app-widget-list
                    title="Latest Projects"
                    icon="folder-open-outline"
                    emptyMessage="No projects have been added yet."
                    [items]="latestProjects">
                </app-widget-list>

                <app-widget-list
                    title="Latest Blogs"
                    icon="newspaper-outline"
                    emptyMessage="No blog posts have been added yet."
                    [items]="latestBlogs">
                </app-widget-list>

            </div>

            <div class="grid">

                <app-widget-list
                    title="Recent Activities"
                    icon="time-outline"
                    emptyMessage="No recent activity to show."
                    [items]="recentActivities">
                </app-widget-list>

                <app-progress-card
                    *ngIf="storage"
                    [data]="storage">
                </app-progress-card>

            </div>

            <div class="grid">

                <app-status-card
                    [items]="systemStatus">
                </app-status-card>

                <app-quick-actions
                    [actions]="quickActions">
                </app-quick-actions>

            </div>

        </ng-container>

    </div>

</ion-content>
