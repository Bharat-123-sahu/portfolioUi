<ion-content class="login-page">

  <div class="login-container">

    <ion-card>

      <ion-card-header>

        <ion-card-title>
          Portfolio CMS
        </ion-card-title>

        <ion-card-subtitle>
          Sign in to continue
        </ion-card-subtitle>

      </ion-card-header>

      <ion-card-content>

        <form
          [formGroup]="loginForm"
          (ngSubmit)="submit()"
        >

          <ion-item>

            <ion-label position="stacked">
              Email
            </ion-label>

            <ion-input
              type="email"
              formControlName="email">
            </ion-input>

          </ion-item>

          <ion-item>

            <ion-label position="stacked">
              Password
            </ion-label>

            <ion-input
              type="password"
              formControlName="password">
            </ion-input>

          </ion-item>

          <div class="login-actions">
            <ion-text
              role="button"
              tabindex="0"
              routerLink="/login/forgot-password"
            >
              Forgot password?
            </ion-text>
          </div>

          <ion-button
            expand="block"
            type="submit">

            Login

          </ion-button>

        </form>

      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
