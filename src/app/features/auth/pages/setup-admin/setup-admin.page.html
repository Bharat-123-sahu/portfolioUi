<ion-content class="setup-admin-page" [fullscreen]="true">
  <main class="setup-admin-stage">
    <form class="setup-admin-form" [formGroup]="form" (ngSubmit)="submit()">
      <ion-item lines="none" class="setup-field">
        <ion-label position="stacked">Email</ion-label>
        <ion-input
          type="email"
          formControlName="email"
          autocomplete="email"
        ></ion-input>
      </ion-item>
      <ion-text
        color="danger"
        *ngIf="form.controls.email.touched && form.controls.email.hasError('required')"
      >
        <small>Email is required.</small>
      </ion-text>
      <ion-text
        color="danger"
        *ngIf="form.controls.email.touched && form.controls.email.hasError('email')"
      >
        <small>Enter a valid email address.</small>
      </ion-text>

      <ion-item lines="none" class="setup-field">
        <ion-label position="stacked">Password</ion-label>
        <ion-input
          type="password"
          formControlName="password"
          autocomplete="new-password"
        ></ion-input>
      </ion-item>
      <ion-text
        color="danger"
        *ngIf="form.controls.password.touched && form.controls.password.hasError('required')"
      >
        <small>Password is required.</small>
      </ion-text>
      <ion-text
        color="danger"
        *ngIf="form.controls.password.touched && form.controls.password.hasError('strongPassword')"
      >
        <small
          >Password must include uppercase, lowercase, number, and special
          character.</small
        >
      </ion-text>

      <div class="strength" aria-hidden="true">
        <span
          *ngFor="let item of [1,2,3,4,5]"
          [class.active]="strength().score >= item"
        ></span>
      </div>

      <ion-item lines="none" class="setup-field">
        <ion-label position="stacked">Confirm Password</ion-label>
        <ion-input
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
        ></ion-input>
      </ion-item>
      <ion-text
        color="danger"
        *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')"
      >
        <small>Confirm password is required.</small>
      </ion-text>
      <ion-text
        color="danger"
        *ngIf="form.touched && form.hasError('passwordMismatch')"
      >
        <small>Passwords must match.</small>
      </ion-text>
      <ion-text color="danger" *ngIf="serverError">
        <small>{{ serverError }}</small>
      </ion-text>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="loading || form.invalid"
      >
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">Create Admin</span>
      </ion-button>
    </form>
  </main>
</ion-content>
