<ion-content class="auth-shell" [fullscreen]="true">
  <div class="premium-bg">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <main class="auth-stage">
    <section class="auth-card">
      <a class="back-link" routerLink="/login">
        <ion-icon name="arrow-back-outline"></ion-icon>
        Back to login
      </a>

      <div class="brand-orb">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
      </div>

      <p class="eyebrow">Account recovery</p>
      <h1>Forgot password?</h1>
      <p class="subtitle">
        Enter your admin email and we will send a secure 6 digit verification code.
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <ion-item lines="none" class="premium-field">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-label position="stacked">Email address</ion-label>
          <ion-input type="email" formControlName="email" autocomplete="email"></ion-input>
        </ion-item>
        <ion-text color="danger" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          <small>Enter a valid email address.</small>
        </ion-text>

        <ion-button expand="block" type="submit" [disabled]="loading || form.invalid">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Send OTP</span>
        </ion-button>
      </form>
    </section>
  </main>
</ion-content>
