<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      {{ hero ? 'Edit Hero' : 'Add Hero' }}
    </ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="close()">
        Close
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <form [formGroup]="heroForm">

    <!-- General Information -->

    <h2>General Information</h2>

    <ion-item>
      <ion-input
        label="Title"
        labelPlacement="stacked"
        formControlName="title">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Subtitle"
        labelPlacement="stacked"
        formControlName="subtitle">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Description"
        labelPlacement="stacked"
        formControlName="description">
      </ion-textarea>
    </ion-item>

    <hr>

    <!-- Profile Image -->

    <h2>Profile Image</h2>

    <ion-item>
      <input
        type="file"
        accept="image/*"
        (change)="onFileSelected($event)">
    </ion-item>

    <div
      class="image-preview"
      *ngIf="heroForm.get('profileImage')?.value">

      <img
        [src]="environment.apiUrl + heroForm.get('profileImage')?.value"
        alt="Hero Image">

    </div>

    <hr>

    <!-- Social Links -->

    <h2>Social Links</h2>

    <ion-item>
      <ion-input
        label="GitHub URL"
        labelPlacement="stacked"
        formControlName="githubUrl">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="LinkedIn URL"
        labelPlacement="stacked"
        formControlName="linkedinUrl">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Resume URL"
        labelPlacement="stacked"
        formControlName="resumeUrl">
      </ion-input>
    </ion-item>

    <hr>

    <!-- Contact -->

    <h2>Contact Information</h2>

    <ion-item>
      <ion-input
        label="Email"
        labelPlacement="stacked"
        formControlName="email">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Phone"
        labelPlacement="stacked"
        formControlName="phone">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Location"
        labelPlacement="stacked"
        formControlName="location">
      </ion-input>
    </ion-item>

    <hr>

    <!-- Settings -->

    <h2>Settings</h2>

    <ion-item>
      <ion-checkbox
        slot="start"
        formControlName="isActive">
      </ion-checkbox>

      <ion-label>
        Active
      </ion-label>
    </ion-item>

    <ion-button
      expand="block"
      color="primary"
      [disabled]="heroForm.invalid || isSubmitting"
      (click)="submit()">

      {{ hero ? 'Update Hero' : 'Save Hero' }}

    </ion-button>

  </form>

</ion-content>
