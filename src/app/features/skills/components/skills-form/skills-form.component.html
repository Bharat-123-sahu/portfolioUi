<ion-header>

  <ion-toolbar color="primary">

    <ion-title>

      {{ skill ? 'Edit Skill' : 'Add Skill' }}

    </ion-title>

    <ion-buttons slot="end">

      <ion-button (click)="close()">

        Close

      </ion-button>

    </ion-buttons>

  </ion-toolbar>

</ion-header>

<ion-content class="ion-padding">

  <form
    [formGroup]="skillForm"
    (ngSubmit)="submit()">

    <!-- Skill Information -->

    <ion-card>

      <ion-card-header>

        <ion-card-title>

          Skill Information

        </ion-card-title>

      </ion-card-header>

      <ion-card-content>

        <ion-grid>

          <ion-row>

            <ion-col size="12">

              <app-image-upload
                label="Skill Icon"
                [imageUrl]="skillForm.get('icon')?.value"
                (imageUploaded)="skillForm.patchValue({ icon: $event })">
              </app-image-upload>

            </ion-col>

          </ion-row>

          <ion-row>

            <ion-col size="12" sizeMd="6">

              <ion-item>

                <ion-label position="stacked">

                  Skill Name <ion-text color="danger">*</ion-text>

                </ion-label>

                <ion-input
                  formControlName="name"
                  placeholder="Angular">
                </ion-input>

              </ion-item>

            </ion-col>

            <ion-col size="12" sizeMd="6">

              <ion-item>

                <ion-label position="stacked">

                  Slug

                </ion-label>

                <ion-input
                  formControlName="slug"
                  readonly>
                </ion-input>

              </ion-item>

            </ion-col>

          </ion-row>

          <ion-row>

            <ion-col size="12" sizeMd="6">

              <ion-item>

                <ion-label position="stacked">

                  Category

                </ion-label>

                <ion-select
                  formControlName="category"
                  interface="popover">

                  <ion-select-option
                    *ngFor="let category of categories"
                    [value]="category">

                    {{ category }}

                  </ion-select-option>

                </ion-select>

              </ion-item>

            </ion-col>

            <ion-col size="12" sizeMd="6">

              <ion-item>

                <ion-label position="stacked">

                  Display Order

                </ion-label>

                <ion-input
                  type="number"
                  formControlName="displayOrder">
                </ion-input>

              </ion-item>

            </ion-col>

          </ion-row>

        </ion-grid>

      </ion-card-content>

    </ion-card>

    <!-- Skill Level -->

    <ion-card>

      <ion-card-header>

        <ion-card-title>

          Skill Level

        </ion-card-title>

      </ion-card-header>

      <ion-card-content>

        <ion-item lines="none">

          <ion-label>

            Percentage

          </ion-label>

          <ion-note slot="end">

            {{ skillForm.value.percentage }}%

          </ion-note>

        </ion-item>

        <ion-range
          min="0"
          max="100"
          step="1"
          snaps="true"
          ticks="true"
          formControlName="percentage">
        </ion-range>

      </ion-card-content>

    </ion-card>

    <!-- Settings -->

    <ion-card>

      <ion-card-header>

        <ion-card-title>

          Settings

        </ion-card-title>

      </ion-card-header>

      <ion-card-content>

        <ion-item>

          <ion-checkbox
            slot="start"
            formControlName="isFeatured">
          </ion-checkbox>

          <ion-label>

            Featured Skill

          </ion-label>

        </ion-item>

        <ion-item>

          <ion-checkbox
            slot="start"
            formControlName="isActive">
          </ion-checkbox>

          <ion-label>

            Active

          </ion-label>

        </ion-item>

      </ion-card-content>

    </ion-card>

    <!-- Actions -->

    <div class="form-actions">

      <ion-button
        fill="outline"
        color="medium"
        type="button"
        (click)="close()">

        Cancel

      </ion-button>

      <ion-button
        type="submit"
        color="primary"
        [disabled]="saving || skillForm.invalid">

        {{ saving ? 'Saving...' : (skill ? 'Update Skill' : 'Save Skill') }}

      </ion-button>

    </div>

  </form>

</ion-content>
