<ion-content class="ion-padding">

  <app-page-header
    title="Certificate Management"
    subtitle="Manage your professional certificates."
    buttonText="Add Certificate"
    [showButton]="true"
    (buttonClick)="addCertificate()">
  </app-page-header>

  <ion-card>

    <ion-card-content>

      <app-search-toolbar
        placeholder="Search by title, issuer or credential ID..."
        (searchChanged)="searchCertificates($event)">
      </app-search-toolbar>

      <app-loading
        *ngIf="loading"
        message="Loading certificates...">
      </app-loading>

      <ng-container *ngIf="!loading">

        <app-empty-state
          *ngIf="filteredCertificates.length === 0"
          icon="ribbon-outline"
          title="No Certificates Found"
          message="Click 'Add Certificate' to create your first certificate.">
        </app-empty-state>

        <app-data-table
          *ngIf="filteredCertificates.length > 0"
          [columns]="columns"
          [data]="paginatedCertificates"
          [showActions]="true"
          (edit)="editCertificate($event)"
          (delete)="deleteCertificate($event)">
        </app-data-table>

        <div
          class="pagination"
          *ngIf="filteredCertificates.length > pageSize">

          <ion-button
            fill="outline"
            size="small"
            [disabled]="currentPage === 1"
            (click)="previousPage()">

            Previous

          </ion-button>

          <span class="page-info">

            Page {{ currentPage }} of {{ totalPages }}

          </span>

          <ion-button
            fill="outline"
            size="small"
            [disabled]="currentPage === totalPages"
            (click)="nextPage()">

            Next

          </ion-button>

        </div>

      </ng-container>

    </ion-card-content>

  </ion-card>

</ion-content>
